# Tests and typechecks every package on each push to master and each pull
# request. macOS, as navi's attachments (sips, PDFKit) and its terminal test
# (script) use what macOS ships.
name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # navi's grep and glob tools run ripgrep, and their tests do too.
      - run: brew install ripgrep

      # The browser tests drive a real, headless Chromium.
      - run: npx playwright-core install chromium

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  # neosh, the shell, is Rust.
  neosh:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: neosh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            neosh/target
          key: neosh-${{ hashFiles('neosh/Cargo.lock') }}

      - run: cargo test

      # The installer builds the release and installs only over a neosh.
      - name: Install
        run: |
          NEOSH_BIN_DIR="$RUNNER_TEMP/bin" ./install.sh
          "$RUNNER_TEMP/bin/neosh" -c 'test "$((6 * 7))" = 42'
          NEOSH_BIN_DIR="$RUNNER_TEMP/bin" ./install.sh --uninstall
          test ! -e "$RUNNER_TEMP/bin/neosh"
