[package]
name = "neosh"
version = "0.1.0"
edition = "2024"
description = "A bash-compatible shell with navi inside"
license = "MIT"
publish = false

[dependencies]
brush-core = "0.5.0"
brush-builtins = "0.2.0"
brush-interactive = { version = "0.4.0", features = ["reedline", "minimal"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]

[profile.release]
lto = "thin"
